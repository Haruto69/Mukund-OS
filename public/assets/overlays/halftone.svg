<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048" aria-hidden="true">
  <title>Comic halftone dot field (tileable)</title>
  <defs>
    <pattern id="ht" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.4" fill="#000"/>
      <circle cx="21" cy="21" r="3.4" fill="#000"/>
    </pattern>
    <radialGradient id="ht-fade" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.25"/>
    </radialGradient>
    <mask id="ht-mask"><rect width="2048" height="2048" fill="url(#ht-fade)"/></mask>
  </defs>
  <rect width="2048" height="2048" fill="url(#ht)" mask="url(#ht-mask)"/>
</svg>
